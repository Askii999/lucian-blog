name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run setup:assets
      - run: npm run check:secrets
      - run: npm run validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Validate an external friend application
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != github.repository_owner
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if git diff --name-only "$PR_BASE_SHA" HEAD | grep -q '^content/friends/'; then
            npm run check:friend-pr
          fi
      - run: npm run build
      - run: node scripts/smoke.mjs
